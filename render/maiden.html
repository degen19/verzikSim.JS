    list.forEach((x, k) => { const [dx, dy] = SLOT[k]; html += `<div class="hs" style="left:${sx + dx}px;top:${sy + dy}px;background-image:url(${SPL[x.kind]})">${x.n}</div>`; });
  }
  hsLayer.innerHTML = html;
  r.render(scene, cam);
};
window.ready = true;
// ---- playback: real time (a tick is 0.6s), Low at up to 30 frames a second, Medium at up to 60; seeking replays from
// the start so every effect's state matches
const PEND = R.dead != null ? R.dead + 8 : (R.proc30 ?? R.proc50 ?? R.room[R.room.length - 1].t) + 4;
const seek = document.getElementById("seek"), pp = document.getElementById("pp"), spd = document.getElementById("spd"), ttEl = document.getElementById("tt");
seek.max = PEND; document.getElementById("ql").textContent = QUAL === "low" ? "Low · 30 fps" : "Medium · 60 fps";
let pos = Number(q.get("at") || 0), playing = q.get("play") !== "0", lastT = null, lastDraw = 0, drawnTick = -1;
if (spd) spd.value = q.get("spd") || "1"; pp.textContent = playing ? "Pause" : "Play";
// going back: start the player again at that tick (every effect's state built forward from the start, as in a recording)
const rewind = (x, play) => { const u = new URL(location.href); u.searchParams.set("at", String(x)); u.searchParams.set("play", play ? "1" : "0"); u.searchParams.set("spd", spd.value); location.replace(u.href); };
const show = (x) => { const t = Math.min(PEND, Math.floor(x)), f = Math.min(0.999, x - t);
  for (let k = drawnTick + 1; k < t; k++) window.frame(k, 0);    // every tick in between (its events fire on it)
  window.frame(t, t >= PEND ? 0 : f); drawnTick = t; seek.value = t; ttEl.textContent = `${(x * 0.6).toFixed(1)}s / ${(PEND * 0.6).toFixed(1)}s`; };
pp.onclick = () => { if (!playing && pos >= PEND) return rewind(0, true); playing = !playing; pp.textContent = playing ? "Pause" : "Play"; };
seek.oninput = () => { const x = Number(seek.value); if (x < drawnTick) return rewind(x, playing); pos = x; show(pos); };
addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); pp.onclick(); } });
addEventListener("resize", () => { W = innerWidth; H = innerHeight; r.setSize(W, H); cam.aspect = W / H; cam.updateProjectionMatrix(); show(pos); });
const loop = (now) => {
  requestAnimationFrame(loop);
  if (lastT == null) lastT = now; const dt = (now - lastT) / 1000; lastT = now;
  if (playing) { pos += dt / 0.6 * Number(spd.value); if (pos >= PEND) { pos = PEND; playing = false; pp.textContent = "Replay"; } }
  if (now - lastDraw < 1000 / FPS - 2) return; lastDraw = now; show(pos);
};
requestAnimationFrame(loop);
</script></body></html>
